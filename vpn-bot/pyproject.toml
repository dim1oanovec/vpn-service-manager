[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "B008",   # Depends(...) в аргументах по умолчанию
  "RUF001", # кириллица в строках — тексты бота на русском
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Переменные окружения обязаны выставляться до импорта app.config.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
exclude = "migrations/"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
